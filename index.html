<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative favicon path so it resolves under a GitHub Pages project
         path (/<repo>/) as well as at a site root. Vite leaves this as-is. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SEQUENCE / CREATIVE — AI Artist, Animation and Motion Design. Imagination, in motion." />
    <meta name="theme-color" content="#080A09" />
    <!-- Open Graph (home page fallback; per-route titles/descriptions are
         set by JS at runtime, which crawlers may not execute — see README).
         og:image is absolute for the published site
         https://rahul-net.github.io/sequenceanimation/ so social previews
         can fetch it. -->
    <meta property="og:title" content="SEQUENCE / CREATIVE — Imagination, in Motion" />
    <meta property="og:description" content="AI-generated worlds. Cinematic animation. Visual experiences crafted with intention." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rahul-net.github.io/sequenceanimation/thumbnails/showreel-poster.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SEQUENCE / CREATIVE — Imagination, in Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
